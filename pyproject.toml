[project]
name = "medicare"
version = "0.1.0"
description = "Production-Grade Multi-Agent AI Service Platform with Dual-Tier Persistence, Dual-Mode Streaming, and Multimodal Interface"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MediCare Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.12",
    "streamlit>=1.40.0",
    "duckduckgo-search>=6.3.0",
    "aiosqlite>=0.20.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "chromadb>=0.4.22",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "rank-bm25>=0.2.2",
]

[project.scripts]
medicare-setup = "medicare.medicare.dataset.cli:main"
medicare-evals = "medicare.medicare.evals.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medicare", "ui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "reportlab>=4.2.0",
]
