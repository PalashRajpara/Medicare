# Application Identity, Localization, and UI Configuration
app_name: "MediCare"
app_title: "MediCare"
app_subtitle: "Your Trusted Healthcare & Insurance Navigator"
tagline: "Your Trusted Healthcare & Insurance Navigator"
domain_description: "Healthcare procedural cost comparison, hospital wait-time intelligence, and insurance policy guidance"
default_model: "openai/gpt-oss-120b"
fallback_model: "mock-gpt-4"

# Localization & Formatting
currency_symbol: "₹"
currency_code: "INR"
currency_locale: "en_IN"
currency_column_hints:
  - "cost"
  - "rent"
  - "fee"
  - "price"
  - "amount"
  - "inr"

boolean_column_hints:
  - "cashless"
  - "accredited"
  - "accepted"
  - "network"
  - "active"

# Sample Questions
sample_questions:
  - "Compare procedure costs in your city"
  - "Hospitals with shortest wait times"
  - "Waiting periods for insurance claims"

user_doc_sample_questions:
  - "Summarize key coverage limits and waiting periods in my uploaded policy document"
  - "Are there any exclusions or copay requirements in my uploaded documents?"

suggestion_templates:
  - "Compare {procedure} costs in {city}"
  - "Shortest wait times for {procedure} in {city}"
  - "Waiting periods under {insurer}"

mock_queries:
  hospitals_sql: "SELECT DISTINCT h.name AS hospital_name, h.city, p.procedure_name, p.min_cost_inr, p.max_cost_inr, p.avg_cost_inr, p.avg_wait_days FROM hospitals h JOIN hospital_procedures p ON h.hospital_id = p.hospital_id WHERE {where_sql} ORDER BY p.avg_cost_inr ASC LIMIT 50"
  hospitals_insurer_sql: "SELECT DISTINCT h.name AS hospital_name, h.city, p.procedure_name, p.min_cost_inr, p.max_cost_inr, p.avg_cost_inr, p.avg_wait_days, a.insurer_name, a.cashless_accepted FROM hospitals h JOIN hospital_procedures p ON h.hospital_id = p.hospital_id JOIN insurer_acceptance a ON h.hospital_id = a.hospital_id WHERE {where_sql} ORDER BY p.avg_cost_inr ASC LIMIT 50"
  hospitals_count_sql: "SELECT count(*) AS hospital_count FROM hospitals h WHERE {where_sql}"
  demo_fail_sql: "SELECT h.name AS hospital_name, h.city, p.procedure_name, p.cost_inr FROM hospitals h JOIN hospital_procedures p ON h.hospital_id = p.hospital_id LIMIT 10"
  where_city: "lower(h.city) LIKE lower('%{val}%')"
  where_procedure: "lower(p.procedure_name) LIKE lower('%{val}%')"
  where_insurer: "lower(a.insurer_name) LIKE lower('%{val}%')"
  where_accepted: "a.cashless_accepted = 1"
  fix_invalid_col: "p.cost_inr"
  fix_target_col: "p.avg_cost_inr"

# Feature Flags
features:
  voice: false

# Empty State Landing
empty_state:
  welcome_title: ""
  welcome_subtitle: "Compare procedural tariffs, surgery costs, and wait times across accredited hospitals, or verify insurance coverage."
  cards:
    - title: "Hospital Costs"
      icon: "🏥"
      description: "Compare procedure tariffs, surgery ranges, and wait times across hospitals."
      prompt: "Compare surgical procedure costs and wait times across hospitals"
    - title: "Policy & Claims"
      icon: "📋"
      description: "Understand waiting periods, day-care clauses, cashless claims, and appeal steps."
      prompt: "What are the common waiting periods and claim appeal steps?"
    - title: "Personal Documents"
      icon: "📁"
      description: "Upload policy documents or hospital bills to verify copays, sub-limits, and exclusions."
      prompt: "Summarize key coverage limits and waiting periods in my uploaded policy document"

